<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Radar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#000;--card:#111;--border:#222;--text:#fff;--dim:#8a8a8a;--green:#00e060;--red:#ff453a;--accent:#fff;--accent-text:#000}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:12px 12px calc(40px + env(safe-area-inset-bottom,0px));padding-top:calc(12px + env(safe-area-inset-top,0px))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.logo{font-weight:900;letter-spacing:1px;text-transform:uppercase;font-size:17px}
.tabs{display:flex;gap:6px}
.tab,.chip,.sbtn,.small{background:var(--card);border:1px solid var(--border);color:var(--dim);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.tab{padding:6px 10px}
.tab.on,.chip.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.row{display:flex;gap:8px;margin-bottom:10px}
input,select{flex:1;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;outline:none}
input:focus,select:focus{border-color:#fff}
.go{background:var(--accent);color:var(--accent-text);border:0;border-radius:8px;padding:0 16px;font-weight:800;font-size:13px;cursor:pointer}
.go:disabled{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 10px;white-space:nowrap;border-radius:20px;font-size:11px}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.filters label{font-size:10px;color:var(--dim);display:block;margin-bottom:3px;text-transform:uppercase}
.filters input{padding:8px;font-size:13px;width:100%}
.info{font-size:11px;color:var(--dim);margin-bottom:10px;line-height:1.5}
.warn{color:#ffb020}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.card .body{padding:12px}
.thumb{width:100%;height:220px;object-fit:cover;background:#1a1a1a;display:block}
.head{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;gap:8px}
.title{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:8px;word-break:break-word}
.price{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.rub{font-size:18px;font-weight:900}
.orig{font-size:12px;color:var(--dim)}
.profit{display:flex;justify-content:space-between;align-items:center;background:#000;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:8px}
.profit b{font-size:14px}
.pos{color:var(--green)}.neg{color:var(--red)}
details{font-size:11px;color:var(--dim);margin-bottom:8px}
details summary{cursor:pointer;padding:2px 0}
.br{display:flex;justify-content:space-between;padding:2px 0}
.acts{display:flex;gap:6px}
.btn{flex:1;padding:10px 0;border-radius:8px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;border:0}
.open{background:#fff;color:#000}
.fav{flex:0 0 46px;background:transparent;color:#fff;border:1px solid var(--border)}
.fav.on{background:#fff;color:#000}
.more{width:100%;padding:12px;margin:4px 0 12px}
.small{padding:6px 10px}
.empty{text-align:center;color:var(--dim);padding:30px 10px;font-size:13px}
.loader{text-align:center;color:var(--dim);padding:40px;font-size:13px;letter-spacing:.5px}
.track{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top">
  <div class="logo">Radar ⚡</div>
  <div class="tabs">
    <button class="tab on" data-tab="radar">Радар</button>
    <button class="tab" data-tab="fav">★ <span id="favN">0</span></button>
    <button class="tab" data-tab="tracks">🔔</button>
  </div>
</div>

<div id="v-radar">
  <div class="row">
    <input id="q" type="search" placeholder="Бренд и модель, например Stone Island hoodie" enterkeyhint="search">
    <button class="go" id="goBtn">Искать</button>
  </div>
  <div class="row">
    <select id="sort">
      <option value="profit">📈 Больший профит</option>
      <option value="price_asc">💸 Цена: низкая → высокая</option>
      <option value="price_desc">💎 Цена: высокая → низкая</option>
      <option value="new">🆕 Сначала новые</option>
    </select>
  </div>
  <div class="filters">
    <div><label>Макс. цена, ₽</label><input id="maxp" inputmode="numeric" placeholder="любая"></div>
    <div><label>Мин. профит, ₽</label><input id="minp" inputmode="numeric" placeholder="любой"></div>
    <div><label>Цена РФ, ₽</label><input id="rf" inputmode="numeric" placeholder="авто"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="info" class="info"></div>
  <div id="loader" class="loader hidden">СКАНИРУЕМ РЫНКИ…</div>
  <div id="results"></div>
  <button class="small more hidden" id="moreBtn">Показать ещё</button>
  <button class="small more hidden" id="trackBtn">🔔 Следить за этим запросом</button>
</div>

<div id="v-fav" class="hidden"><div id="favList"></div></div>
<div id="v-tracks" class="hidden"><div id="trackList"></div></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
//  https://dddcd798155fe5dc-172-93-107-166.serveousercontent.com
//  "https://dddcd798155fe5dc-172-93-107-166.serveousercontent.com".
const API_BASE = "https://78206c1069b4d2a1-172-93-107-166.serveousercontent.com";
const INIT = tg ? tg.initData : "";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rub = n => Math.round(n).toLocaleString("ru-RU") + " ₽";
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "#";

let state = {items: [], total: 0, offset: 0, sources: [], off: new Set(), query: "", busy: false};
const BY_H = {};

async function api(path, opts = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 45000);
  try {
    const r = await fetch(API_BASE + path, {...opts, signal: ctrl.signal,
      headers: {"Content-Type": "application/json", "X-Init-Data": INIT, ...(opts.headers || {})}});
    let data = {};
    try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error(data.error || ("Ошибка " + r.status));
    return data;
  } catch (e) {
    if (e.name === "AbortError") throw new Error("Сервер долго не отвечает");
    throw e;
  } finally { clearTimeout(timer); }
}

function cardHtml(it) {
  const hasProfit = it.profit_rub !== null && it.profit_rub !== undefined;
  const cls = hasProfit && it.profit_rub >= 0 ? "pos" : "neg";
  const sign = hasProfit && it.profit_rub >= 0 ? "+" : "−";
  const date = it.ts ? new Date(it.ts * 1000).toLocaleString("ru-RU", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"}) : "";
  const img = /^https?:\/\//i.test(it.image || "")
    ? `<img class="thumb" loading="lazy" referrerpolicy="no-referrer" src="${esc(it.image)}" onerror="this.style.display='none'">` : "";
  return `<div class="card" data-h="${esc(it.h)}">${img}<div class="body">
    <div class="head"><span>${esc(it.platform)}</span><span>${it.size ? "SZ " + esc(it.size) : ""}${date ? " · " + date : ""}</span></div>
    <div class="title">${esc(it.title)}</div>
    <div class="price"><span class="rub">${rub(it.price_rub)}</span><span class="orig">(${esc(it.orig)})</span></div>
    <div class="profit"><span>Под ключ ~${rub(it.total_rub)}</span>
      ${hasProfit ? `<b class="${cls}">${sign}${rub(Math.abs(it.profit_rub))} · ${it.margin}%</b>` : `<span>цена РФ неизвестна</span>`}</div>
    <details><summary>Из чего состоит цена</summary>
      <div class="br"><span>Лот</span><span>${rub(it.price_rub)}</span></div>
      <div class="br"><span>Доставка до карго</span><span>${rub(it.ship_rub)}</span></div>
      <div class="br"><span>Карго (~${it.kg} кг)</span><span>${rub(it.cargo_rub)}</span></div>
      ${it.fee_rub ? `<div class="br"><span>Комиссия площадки</span><span>${rub(it.fee_rub)}</span></div>` : ""}
      <div class="br"><span>Пошлина (оценка)</span><span>${rub(it.duty_rub)}</span></div>
    </details>
    <div class="acts"><a class="btn open" data-open="${esc(safeUrl(it.url))}">Открыть лот</a>
      <button class="btn fav ${it.fav ? "on" : ""}" data-fav="${esc(it.h)}">★</button></div>
  </div></div>`;
}

function render(items, el, append) {
  items.forEach(i => BY_H[i.h] = i);
  const html = items.map(cardHtml).join("");
  if (append) el.insertAdjacentHTML("beforeend", html); else el.innerHTML = html;
}

function renderChips() {
  $("chips").innerHTML = state.sources.map(s =>
    `<div class="chip ${state.off.has(s.key) ? "" : "on"}" data-src="${esc(s.key)}">${esc(s.label)}</div>`).join("");
}

function params(offset) {
  const p = new URLSearchParams({q: state.query, sort: $("sort").value, offset: offset, limit: 30});
  if ($("maxp").value.trim()) p.set("max_price", $("maxp").value.replace(/\s/g, ""));
  if ($("minp").value.trim()) p.set("min_profit", $("minp").value.replace(/\s/g, ""));
  if ($("rf").value.trim()) p.set("rf", $("rf").value.replace(/\s/g, ""));
  if (state.off.size) p.set("off", [...state.off].join(","));
  return p;
}

async function search(reset = true) {
  if (state.busy) return;
  if (reset) {
    state.query = $("q").value.trim();
    if (!state.query) return;
    state.offset = 0;
    $("results").innerHTML = "";
  }
  state.busy = true;
  $("goBtn").disabled = true;
  $("loader").classList.remove("hidden");
  $("moreBtn").classList.add("hidden");
  try {
    const d = await api("/api/search?" + params(state.offset));
    if (d.sources && d.sources.length && !state.sources.length) { state.sources = d.sources; renderChips(); }
    render(d.items, $("results"), !reset);
    state.offset += d.items.length;
    state.total = d.total;
    let info = `Найдено ${d.total_raw}, показано по фильтрам: ${d.total}.`;
    if (d.rf && d.rf.price) info += ` Цена продажи в РФ: <b>${rub(d.rf.price)}</b> (${esc(d.rf.basis)}).`;
    else info += " Цена продажи в РФ неизвестна, профит не считается.";
    if (d.rf && /Gemini/.test(d.rf.basis)) info += ` <span class="warn">Это оценка, впиши свою цену в поле «Цена РФ».</span>`;
    if (d.errors && d.errors.length) info += `<br><span class="warn">⚠️ ${esc(d.errors.join("; "))}</span>`;
    $("info").innerHTML = info;
    if (!d.items.length && reset) $("results").innerHTML = '<div class="empty">Ничего не найдено. Ослабь фильтры или измени запрос.</div>';
    $("moreBtn").classList.toggle("hidden", state.offset >= state.total);
    $("trackBtn").classList.toggle("hidden", !state.query);
  } catch (e) {
    $("info").innerHTML = `<span class="warn">⚠️ ${esc(e.message)}</span>`;
  } finally {
    state.busy = false;
    $("goBtn").disabled = false;
    $("loader").classList.add("hidden");
  }
}

async function toggleFav(h, btn) {
  try {
    const d = await api("/api/fav", {method: "POST", body: JSON.stringify({h})});
    if (d.result === "gone") { alert("Лот устарел. Найди его заново."); return; }
    if (BY_H[h]) BY_H[h].fav = d.result === "added";
    document.querySelectorAll(`[data-fav="${h}"]`).forEach(b => b.classList.toggle("on", d.result === "added"));
    loadFavCount();
    if (!$("v-fav").classList.contains("hidden")) loadFavs();
  } catch (e) { alert(e.message); }
}

async function loadFavCount() {
  try { const d = await api("/api/favs"); $("favN").textContent = d.items.length; } catch (e) {}
}
async function loadFavs() {
  try {
    const d = await api("/api/favs");
    $("favN").textContent = d.items.length;
    d.items.forEach(i => i.fav = true);
    if (!d.items.length) $("favList").innerHTML = '<div class="empty">Избранное пусто</div>';
    else render(d.items, $("favList"), false);
  } catch (e) { $("favList").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function loadTracks() {
  try {
    const d = await api("/api/tracks");
    if (!d.tracks.length) { $("trackList").innerHTML = '<div class="empty">Слежений нет. Нажми «Следить» под результатами поиска.</div>'; return; }
    $("trackList").innerHTML = d.tracks.map(t => {
      const f = t.filters || {}, x = [];
      if (f.max_price) x.push("до " + rub(f.max_price));
      if (f.min_profit !== null && f.min_profit !== undefined) x.push("профит от " + rub(f.min_profit));
      return `<div class="track"><span>${esc(t.query)}<br><small style="color:var(--dim)">${esc(x.join(", "))}</small></span>
        <button class="small" data-untrack="${t.id}">Удалить</button></div>`;
    }).join("");
  } catch (e) { $("trackList").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function tab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === name));
  ["radar", "fav", "tracks"].forEach(n => $("v-" + n).classList.toggle("hidden", n !== name));
  if (name === "fav") loadFavs();
  if (name === "tracks") loadTracks();
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-src],[data-fav],[data-open],[data-untrack]");
  if (!t) return;
  if (t.dataset.tab) tab(t.dataset.tab);
  else if (t.dataset.src) {
    const k = t.dataset.src;
    state.off.has(k) ? state.off.delete(k) : state.off.add(k);
    renderChips();
    if (state.query) search(true);
  } else if (t.dataset.fav) toggleFav(t.dataset.fav, t);
  else if (t.dataset.open) {
    const u = t.dataset.open;
    if (u === "#") return;
    if (tg && tg.openLink) tg.openLink(u); else window.open(u, "_blank");
  } else if (t.dataset.untrack) {
    await api("/api/untrack", {method: "POST", body: JSON.stringify({id: Number(t.dataset.untrack)})});
    loadTracks();
  }
});

$("goBtn").onclick = () => search(true);
$("q").addEventListener("keydown", e => { if (e.key === "Enter") search(true); });
$("sort").onchange = () => { if (state.query) search(true); };
["maxp", "minp", "rf"].forEach(id => $(id).addEventListener("change", () => { if (state.query) search(true); }));
$("moreBtn").onclick = () => search(false);
$("trackBtn").onclick = async () => {
  try {
    const d = await api("/api/track", {method: "POST", body: JSON.stringify({
      query: state.query, max_price: $("maxp").value.replace(/\s/g, ""), min_profit: $("minp").value.replace(/\s/g, "")})});
    alert(d.ok ? "Слежение включено. Новые лоты придут в бот." : d.error);
  } catch (e) { alert(e.message); }
};

loadFavCount();
</script>
</body>
</html>
