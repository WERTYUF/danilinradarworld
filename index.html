<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danilin Radar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #f39c12;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --border-color: #2c2c2c;
            --green: #2ecc71;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            padding-bottom: 80px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .badge-mode {
            background: #2c2c2c;
            color: var(--accent-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        input {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button.search-btn {
            background: var(--accent-color);
            border: none;
            border-radius: 10px;
            padding: 0 16px;
            color: #000;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .loader {
            display: none;
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
        }

        .listing-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 10px;
        }

        .rub-price {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-color);
        }

        .orig-price {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .analytics-block {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .analytics-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }

        .analytics-row:last-child {
            margin-bottom: 0;
            font-weight: bold;
            color: var(--green);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 4px;
        }

        .btn-open {
            display: block;
            width: 100%;
            background: #2c2c2c;
            color: var(--text-color);
            text-align: center;
            padding: 10px 0;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-open:active {
            background: #3c3c3c;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Danilin Radar ⚡</div>
        <div class="badge-mode">ARBITRAGE</div>
    </div>

    <div class="search-box">
        <input type="text" id="queryInput" placeholder="Бренд или модель (напр. Stone Island)" value="Stone Island">
        <button class="search-btn" onclick="fetchMarketListings()">Искать</button>
    </div>

    <div id="loader" class="loader">Сканируем Grailed и рынок РФ...</div>
    <div id="resultsContainer"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // ТВОЯ АКТУАЛЬНАЯ ССЫЛКА ОТ PINGGY (заменяй ее, если перезапустишь туннель)
        const BACKEND_API_URL = "https://jlhgl-172-93-107-166.run.pinggy-free.link";

        async function fetchMarketListings() {
            let query = document.getElementById('queryInput').value.trim();
            if (!query) {
                alert('Введи поисковый запрос!');
                return;
            }

            let container = document.getElementById('resultsContainer');
            let loader = document.getElementById('loader');
            
            container.innerHTML = '';
            loader.style.display = 'block';

            try {
                let response = await fetch(`${BACKEND_API_URL}/search?q=${encodeURIComponent(query)}`);
                let data = await response.json();
                
                loader.style.display = 'none';

                if (data.items && data.items.length > 0) {
                    renderCards(data.items);
                } else {
                    container.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">Ничего не найдено</div>';
                }
            } catch (err) {
                loader.style.display = 'none';
                console.error(err);
                alert('Ошибка соединения с бэкендом на телефоне!');
            }
        }

        function renderCards(items) {
            let container = document.getElementById('resultsContainer');
            container.innerHTML = '';

            items.forEach(item => {
                let totalCost = item.rub_price + item.cargo;
                let spread = item.rf_avg_price - totalCost;
                
                let card = document.createElement('div');
                card.className = 'listing-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span>${item.platform}</span>
                        <span>РАЗМЕР: ${item.size}</span>
                    </div>
                    <div class="card-title">${item.title}</div>
                    <div class="price-row">
                        <span class="rub-price">${item.rub_price.toLocaleString()} ₽</span>
                        <span class="orig-price">(${item.orig_price})</span>
                    </div>
                    <div class="analytics-block">
                        <div class="analytics-row">
                            <span>С учетом доставки:</span>
                            <span>~${totalCost.toLocaleString()} ₽</span>
                        </div>
                        <div class="analytics-row">
                            <span>Медиана рынка РФ (Авито):</span>
                            <span>${item.rf_avg_price.toLocaleString()} ₽</span>
                        </div>
                        <div class="analytics-row">
                            <span>Потенциальный спред:</span>
                            <span>+${spread.toLocaleString()} ₽</span>
                        </div>
                    </div>
                    <a href="${item.url}" target="_blank" class="btn-open">Открыть лот</a>
                `;
                container.appendChild(card);
            });
        }

        // Автоматически запускаем поиск при открытии мини-приложения
        window.onload = () => {
            fetchMarketListings();
        };
    </script>
</body>
</html>
