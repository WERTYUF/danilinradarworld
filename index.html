<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danilin Radar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --card-bg: #111111;
            --border: #222222;
            --border-hover: #444444;
            --text: #ffffff;
            --text-secondary: #777777;
            --accent-bg: #ffffff;
            --accent-text: #000000;
            --green: #00ff66;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
            padding-bottom: 90px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .logo {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--accent-bg);
            color: var(--accent-text);
            border-color: var(--accent-bg);
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        input {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text);
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: var(--text);
        }

        button.search-btn {
            background: var(--accent-bg);
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            color: var(--accent-text);
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .filters-panel {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filter-chip {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            white-space: nowrap;
            cursor: pointer;
        }

        .filter-chip.active {
            border-color: var(--text);
            color: var(--text);
            background: #1a1a1a;
        }

        .loader {
            display: none;
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .listing-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 8px;
        }

        .rub-price {
            font-size: 17px;
            font-weight: 900;
        }

        .orig-price {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .analytics-block {
            background: #000000;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            font-size: 11px;
            margin-bottom: 10px;
        }

        .analytics-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
            color: var(--text-secondary);
        }

        .analytics-row:last-child {
            margin-bottom: 0;
            font-weight: 800;
            color: var(--green);
            border-top: 1px solid var(--border);
            padding-top: 4px;
            margin-top: 4px;
        }

        .card-actions {
            display: flex;
            gap: 6px;
        }

        .btn {
            flex: 1;
            padding: 9px 0;
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-open {
            background: #ffffff;
            color: #000000;
            border: none;
        }

        .btn-fav {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            max-width: 44px;
        }

        .btn-fav.active {
            background: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Danilin Radar // ⚡</div>
        <div class="nav-tabs">
            <button class="tab-btn active" id="tabRadar" onclick="switchTab('radar')">Радар</button>
            <button class="tab-btn" id="tabFav" onclick="switchTab('fav')">Ордера (<span id="favCount">0</span>)</button>
        </div>
    </div>

    <div id="radarView">
        <div class="search-box">
            <input type="text" id="queryInput" placeholder="Бренд или модель (Stone Island, C.P. Company...)" value="Stone Island">
            <button class="search-btn" onclick="fetchMarketListings()">Парсить</button>
        </div>

        <div class="filters-panel">
            <div class="filter-chip active" onclick="setFilter('all', this)">Все рынки</div>
            <div class="filter-chip" onclick="setFilter('china', this)">🇨🇳 Китай (Goofish)</div>
            <div class="filter-chip" onclick="setFilter('japan', this)">🇯🇵 Япония (Yahoo/Mercari)</div>
            <div class="filter-chip" onclick="setFilter('korea', this)">🇰🇷 Корея</div>
            <div class="filter-chip" onclick="setFilter('grailed', this)">Grailed</div>
            <div class="filter-chip" onclick="setFilter('vinted', this)">Vinted</div>
        </div>

        <div id="loader" class="loader">СКАНИРУЕМ КИТАЙ, ЯПОНИЮ И МИР...</div>
        <div id="resultsContainer"></div>
    </div>

    <div id="favView" style="display: none;">
        <div id="favContainer"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const BACKEND_API_URL = "https://c47f31c5e1859a56-195-3-220-4.serveousercontent.com";
        let currentItems = [];
        let favorites = JSON.parse(localStorage.getItem('danilin_favs') || '[]');

        updateFavCount();

        function switchTab(tab) {
            document.getElementById('tabRadar').classList.toggle('active', tab === 'radar');
            document.getElementById('tabFav').classList.toggle('active', tab === 'fav');
            document.getElementById('radarView').style.display = tab === 'radar' ? 'block' : 'none';
            document.getElementById('favView').style.display = tab === 'fav' ? 'block' : 'none';
            if (tab === 'fav') renderFavorites();
        }

        async function fetchMarketListings() {
            let query = document.getElementById('queryInput').value.trim();
            if (!query) return;

            let container = document.getElementById('resultsContainer');
            let loader = document.getElementById('loader');
            
            container.innerHTML = '';
            loader.style.display = 'block';

            try {
                let response = await fetch(`${BACKEND_API_URL}/search?q=${encodeURIComponent(query)}`);
                let data = await response.json();
                
                loader.style.display = 'none';
                if (data.items) {
                    currentItems = data.items;
                    renderCards(currentItems, container);
                } else {
                    container.innerHTML = '<div style="text-align: center; color: #777; padding: 30px;">Пусто</div>';
                }
            } catch (err) {
                loader.style.display = 'none';
                alert('Ошибка соединения с бэкендом!');
            }
        }

        function renderCards(items, container) {
            container.innerHTML = '';
            if (items.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #777; padding: 30px;">Ничего не найдено</div>';
                return;
            }

            items.forEach(item => {
                let totalCost = item.rub_price + item.cargo;
                let spread = item.rf_avg_price - totalCost;
                let isFav = favorites.some(f => f.id === item.id);

                let card = document.createElement('div');
                card.className = 'listing-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span>${item.platform}</span>
                        <span>SZ: ${item.size}</span>
                    </div>
                    <div class="card-title">${item.title}</div>
                    <div class="price-row">
                        <span class="rub-price">${item.rub_price.toLocaleString()} ₽</span>
                        <span class="orig-price">(${item.orig_price})</span>
                    </div>
                    <div class="analytics-block">
                        <div class="analytics-row">
                            <span>С карго (доставка):</span>
                            <span>~${totalCost.toLocaleString()} ₽</span>
                        </div>
                        <div class="analytics-row">
                            <span>Рынок РФ (Авито):</span>
                            <span>${item.rf_avg_price.toLocaleString()} ₽</span>
                        </div>
                        <div class="analytics-row">
                            <span>Потенциальный профит:</span>
                            <span>+${spread.toLocaleString()} ₽</span>
                        </div>
                    </div>
                    <div class="card-actions">
                        <a href="${item.url}" target="_blank" class="btn btn-open">Открыть лот</a>
                        <button class="btn btn-fav ${isFav ? 'active' : ''}" onclick='toggleFavorite(${JSON.stringify(item)})'>★</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleFavorite(item) {
            let index = favorites.findIndex(f => f.id === item.id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(item);
            }
            localStorage.setItem('danilin_favs', JSON.stringify(favorites));
            updateFavCount();
            
            if (document.getElementById('favView').style.display === 'block') {
                renderFavorites();
            } else {
                renderCards(currentItems, document.getElementById('resultsContainer'));
            }
        }

        function renderFavorites() {
            let container = document.getElementById('favContainer');
            renderCards(favorites, container);
        }

        function updateFavCount() {
            document.getElementById('favCount').innerText = favorites.length;
        }

        function setFilter(type, el) {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            
            let filtered = [...currentItems];
            if (type === 'china') filtered = filtered.filter(i => i.platform.includes('Китай'));
            if (type === 'japan') filtered = filtered.filter(i => i.platform.includes('Япония'));
            if (type === 'korea') filtered = filtered.filter(i => i.platform.includes('Корея'));
            if (type === 'grailed') filtered = filtered.filter(i => i.platform.includes('Grailed'));
            if (type === 'vinted') filtered = filtered.filter(i => i.platform.includes('Vinted'));
            
            renderCards(filtered, document.getElementById('resultsContainer'));
        }

        window.onload = () => {
            fetchMarketListings();
        };
    </script>
</body>
</html>
